---
# Rola common: osnovno stanje sistema prije i nezavisno od Dockera.
# Svaki zadatak mora biti idempotentan (AO-5).

- name: Azuriraj apt kes (keširaj 1h da ponovno izvrsavanje ne mijenja nista)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Instaliraj osnovne pakete
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

# --- AO-4: SSH hardening pod kontrolom Ansible-a ---
# cloud-init ga je postavio pri prvom bootu; ovdje se osigurava da rucna
# izmjena na VM-u ne ostane trajno (to je i primjer konfiguracijskog drifta).

- name: Postavi SSH hardening
  ansible.builtin.copy:
    dest: "{{ common_ssh_hardening.path }}"
    owner: root
    group: root
    mode: "0644"
    content: "{{ common_ssh_hardening.lines | join('\n') }}\n"
  notify: restart ssh

- name: Provjeri da sshd efektivno odbija prijavu lozinkom
  ansible.builtin.command: sshd -T
  register: common_sshd_effective
  changed_when: false
  check_mode: false

- name: Ne smije postojati passwordauthentication yes
  ansible.builtin.assert:
    that:
      - "'passwordauthentication no' in common_sshd_effective.stdout | lower"
    fail_msg: >-
      sshd jos dozvoljava prijavu lozinkom. Provjeri
      {{ common_ssh_hardening.path }} i da drop-in nije nadjacan.
    success_msg: "sshd: PasswordAuthentication no (potvrdjeno sa sshd -T)"
