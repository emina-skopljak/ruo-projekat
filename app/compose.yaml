# Troslojna aplikacija (AO-1) sa mreznom topologijom koja odgovara AO-6:
#
#   web mreza  : frontend + backend      (frontend vidi samo backend)
#   data mreza : backend  + baza         (frontend nema put do baze)
#
# Baza nema objavljen port, a izvana je dostupan samo frontend.
# Isti fajl se koristi lokalno (docker compose) i u VM-u (Ansible), a sve
# vrijednosti koje se razlikuju po okruzenju dolaze iz .env / group_vars.

name: ruo-app

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-notes}
      POSTGRES_USER: ${DB_USER:-notes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD mora biti postavljen}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    networks:
      data:
        ipv4_address: ${DB_IP:-172.28.20.30}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-notes} -d ${DB_NAME:-notes}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-notes}
      DB_USER: ${DB_USER:-notes}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD mora biti postavljen}
    networks:
      web:
        ipv4_address: ${BACKEND_WEB_IP:-172.28.10.20}
      data:
        ipv4_address: ${BACKEND_DATA_IP:-172.28.20.20}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      web:
        ipv4_address: ${FRONTEND_IP:-172.28.10.10}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:

networks:
  web:
    driver: bridge
    ipam:
      config:
        - subnet: ${WEB_SUBNET:-172.28.10.0/24}
  data:
    driver: bridge
    ipam:
      config:
        - subnet: ${DATA_SUBNET:-172.28.20.0/24}
